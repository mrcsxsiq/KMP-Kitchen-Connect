#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle (Kotlin/Native linkReleaseFramework can need a large heap — see devirtualization phase)
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Temporary bypass: AGP 9 forbids com.android.application in the same module
# as org.jetbrains.kotlin.multiplatform, and that combination isn't supported
# by com.android.kotlin.multiplatform.library either (KMP + application isn't
# supported yet at all). composeApp mixes them, so opt back into the old
# DSL/variant API until composeApp's Android target is extracted into its own
# subproject. common/dashboard/order no longer need this — they use
# com.android.kotlin.multiplatform.library.
android.builtInKotlin=false
android.newDsl=false